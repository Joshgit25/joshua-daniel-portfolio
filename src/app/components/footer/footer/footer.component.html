<footer class="footer-marquee" aria-label="Contact and social links">
  <div class="marquee-viewport">
    <div class="marquee-track">
      <a
        *ngFor="let item of loopItems; let i = index"
        class="pill"
        [href]="item.link"  
        [style.--accent]="item.color"
        [attr.aria-label]="item.label + ': ' + item.detail"
        [attr.aria-hidden]="i >= items.length ? 'true' : null"
        [attr.tabindex]="i >= items.length ? -1 : null"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="dot" aria-hidden="true"></span>
        <i [class]="item.icon" aria-hidden="true"></i>
        <span class="pill-label">{{ item.label }}</span>
        <span class="pill-sep" aria-hidden="true">//</span>
        <span class="pill-detail">{{ item.detail }}</span>
      </a>
    </div>
  </div>

</footer>
